# =========================================================================
# KIARA MEDICALS — PRODUCTION NGINX REVERSE PROXY & STATIC ASSET CONFIG
# Target: Single VPS (e.g. Ubuntu 22.04 / 24.04, Debian, AWS EC2, DigitalOcean)
# =========================================================================

# Upstream Node.js cluster managed by PM2
upstream kiara_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

# Rate limiting zone for Layer 7 DDoS mitigation (20 req/s per IP)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# -------------------------------------------------------------------------
# 1. HTTP Server Block — Redirect all traffic to HTTPS
# -------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.kiaramedicals.com admin.kiaramedicals.com;

    # Let's Encrypt ACME Challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------------------------
# 2. HTTPS Server Block — SSL Termination, SPA Static Serving & Reverse Proxy
# -------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.kiaramedicals.com admin.kiaramedicals.com;

    # Path to Vite Production Frontend Build
    root /home/rahul/Desktop/Softee/client/dist;
    index index.html;

    # SSL Certificates (Let's Encrypt / Certbot paths)
    ssl_certificate /etc/letsencrypt/live/app.kiaramedicals.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.kiaramedicals.com/privkey.pem;

    # Modern SSL Protocols & Ciphers (Mozilla Intermediate Configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression for Fast Assets Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Client Request Body Limits (Allows up to 15MB for scanned invoices/prescriptions)
    client_max_body_size 15M;

    # ---------------------------------------------------------------------
    # A. Static Asset Caching (Vite Hashed Chunks in /assets/)
    # ---------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Favicon & robots.txt
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # ---------------------------------------------------------------------
    # B. API Reverse Proxy to Node.js Backend Cluster
    # ---------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://kiara_backend;
        proxy_http_version 1.1;

        # Header Forwarding
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for Long-Running Reports or PDF Invoicing
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable proxy buffering for streaming/fast response
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # ---------------------------------------------------------------------
    # C. React SPA Client-Side Routing Fallback
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
